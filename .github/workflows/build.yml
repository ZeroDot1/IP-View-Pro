name: build

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  build:
    name: ${{ matrix.os }} / ${{ matrix.compiler }} / ${{ matrix.build_type }} / ${{ matrix.sanitizer }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04]
        compiler: [gcc, clang]
        build_type: [Release]
        sanitizer: [none, asan, ubsan]
        exclude:
          # TSan only makes sense with the older ABI; skip for now.
          - sanitizer: tsan
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt 6
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.*'
          host: ${{ matrix.os == 'macos-14' && 'mac' || (matrix.os == 'windows-2022' && 'windows' || 'linux') }}
          target: desktop
          arch: ${{ matrix.os == 'macos-14' && 'clang_64' || (matrix.os == 'windows-2022' && 'win64_msvc2019_64' || 'gcc_64') }}
          modules: 'qtimageformats'

      - name: Install Linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build libgl1-mesa-dev libxkbcommon-dev libxkbcommon-x11-0 libdbus-1-3

      - name: Configure
        run: >
          cmake -S . -B build
          -G Ninja
          -DCMAKE_CXX_COMPILER=${{ matrix.compiler == 'gcc' && 'g++' || 'clang++' }}
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DSANITIZER_TYPE=${{ matrix.sanitizer }}
          -DBUILD_TESTING=ON

      - name: Build
        run: cmake --build build -j$(nproc)

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Smoke test
        run: |
          timeout 3 ./build/IPView || [ $? -eq 124 ]
