name: build

# Per-PR + per-push build matrix. Tests the code on GCC 16
# (C++26) and Clang 19, with and without AddressSanitizer /
# UndefinedBehaviorSanitizer. The same matrix is what
# release.yml would encounter — if it fails here, the
# release will fail too, so we catch it before the tag push.

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  build:
    name: ${{ matrix.os }} / ${{ matrix.compiler }} / ${{ matrix.build_type }} / ${{ matrix.sanitizer }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04]
        compiler: [gcc]
        build_type: [Release]
        sanitizer: [none, asan, ubsan]
        # TSan only makes sense with the older ABI; skip for now.
        exclude:
          - sanitizer: tsan
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v5

      # GCC 16 is the first GCC release with full C++26 support.
      # The ubuntu-toolchain-r/test PPA carries it; GCC 13 from
      # Ubuntu 24.04's default repos does not understand
      # -std=c++26.
      - name: Install GCC 16
        if: matrix.compiler == 'gcc'
        run: |
          sudo apt-get update
          sudo apt-get install -y software-properties-common
          sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test
          sudo apt-get update
          sudo apt-get install -y g++-16 gcc-16
          g++-16 --version

      # Qt 6.8.3 LTS via jurplel. The 'desktop' meta-target
      # includes Core, Gui, Widgets, Network, Sql, Svg, Qml,
      # Quick, etc. — everything the project links against.
      # We do NOT pass a 'modules' parameter because jurplel
      # v4 + aqt 3.x has a known bug where it forwards
      # 'qt_base' (which is the base package, not a module)
      # to aqt and the whole install fails with
      # 'packages not found in package information XML'.
      # See the release.yml comment for the full diagnosis.
      # CMakeLists.txt only requires Qt 6.5+, so 6.8.3 is
      # well above the floor.
      - name: Install Qt 6.8.3
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: linux
          target: desktop
          arch: gcc_64
          cache: true

      - name: Install Linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y \
              cmake ninja-build \
              libgl1-mesa-dev libxkbcommon-dev libxkbcommon-x11-0 libdbus-1-3 \
              libsqlite3-dev libfontconfig1 libfreetype6 \
              libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
              libxcb-randr0 libxcb-render0 libxcb-render-util0 \
              libxcb-shape0 libxcb-shm0 libxcb-sync0 libxcb-xfixes0 \
              libxcb-xinerama0 libxcb-xkb1 \
              libxext6 libxrender1 libxi6 \
              upx-ucl \
              qt6-base-dev qt6-svg-dev qt6-tools-dev

      - name: Configure
        run: >
          cmake -S . -B build
          -G Ninja
          -DCMAKE_CXX_COMPILER=${{ matrix.compiler == 'gcc' && 'g++-16' || 'clang++' }}
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DSANITIZER_TYPE=${{ matrix.sanitizer }}
          -DBUILD_TESTING=ON

      - name: Build
        run: cmake --build build -j$(nproc)

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Smoke test
        run: |
          timeout 3 ./build/IPView -platform offscreen || [ $? -eq 124 ]
