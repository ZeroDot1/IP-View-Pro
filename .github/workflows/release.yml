name: Release

# Triggered by the release-on-changelog.yml workflow pushing a
# new v*.*.* tag, or by manual dispatch for an emergency rebuild.
# Runs the full release pipeline: install the toolchain (GCC 16
# for C++26, Qt 6.8 via jurplel for Qt 6.5+ ABI compat), build
# the binary, run the test suite, package it as an AppImage, and
# attach the AppImage + a SHA-256SUMS file to the GitHub Release
# via the official `gh` CLI (replaces the deprecated
# softprops/action-gh-release action).

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:        # Manual trigger for emergency rebuilds.

permissions:
  contents: write           # Required to upload release assets.

# Node.js 24 opt-in. actions/checkout@v5 and the rest of the
# GitHub-Actions JavaScript actions used here all support Node 24
# as of mid-2026; opting in now silences the deprecation warning
# and protects us from the September 16, 2026 removal of Node 20.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  build:
    name: Build & ship AppImage
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0    # Need full history for the version tag.

      # ── C++26 compiler ─────────────────────────────────────────────
      # Ubuntu 24.04 ships GCC 13.3 which does not understand
      # -std=c++26 (it predates the final C++26 standard). The
      # ubuntu-toolchain-r/test PPA carries g++-16 which is the
      # first GCC release that fully supports C++26.
      - name: Install GCC 16 (C++26)
        run: |
          sudo apt-get update
          sudo apt-get install -y software-properties-common
          sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test
          sudo apt-get update
          sudo apt-get install -y g++-16 gcc-16
          g++-16 --version
          c++filt --version | head -1

      # ── Qt 6 (LTS line) ────────────────────────────────────────────
      # jurplel/install-qt-action downloads the official Qt online
      # installer and provisions the requested Qt version. We pin
      # 6.8.* because it is the current LTS line at the time of
      # writing; CMakeLists.txt only requires Qt 6.5+, so any 6.8
      # patch (6.8.0, 6.8.1, 6.8.2, …) is accepted.
      #
      # modules: qtimageformats adds TIFF/WEBP/etc.; qtsvg is
      # already in the base but is named explicitly so a missing
      # module never silently falls through.
      - name: Install Qt 6.8
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.*'
          host: linux
          target: desktop
          arch: gcc_64
          modules: 'qtimageformats qtsvg qtsql'
          cache: true

      # ── System dependencies ────────────────────────────────────────
      # Three groups:
      #   1. Build toolchain        — cmake, ninja
      #   2. Qt 6 runtime + dev     — libgl1, libxkbcommon, libdbus,
      #                                libsqlite3 (needed for the
      #                                QSQLITE driver the project
      #                                uses), libfontconfig1,
      #                                libfreetype6 (font rendering
      #                                for the SVG icons), libxcb*
      #                                (X11 plugins Qt loads on
      #                                xcb platform even if we run
      #                                offscreen, because Qt probes
      #                                them at startup).
      #   3. AppImage tooling       — fuse + libfuse2 (for the
      #                                appimagetool fallback),
      #                                file + zsync, upx-ucl (for
      #                                the build-time binary
      #                                compression post-build step
      #                                in CMakeLists.txt).
      # The qt6-base-dev / qt6-svg-dev / qt6-tools-dev packages are
      # installed as a belt-and-suspenders backup. jurplel's
      # desktop target should already include everything the
      # project needs, but if the Qt online installer ever serves
      # a partial payload the apt packages in
      # /usr/lib/x86_64-linux-gnu/ will satisfy the find_package
      # call as a fallback.
      - name: Install system dependencies
        run: |
          sudo apt-get install -y \
              cmake ninja-build \
              libgl1-mesa-dev libxkbcommon-dev libxkbcommon-x11-0 libdbus-1-3 \
              libsqlite3-dev \
              libfontconfig1 libfreetype6 \
              libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
              libxcb-randr0 libxcb-render0 libxcb-render-util0 \
              libxcb-shape0 libxcb-shm0 libxcb-sync0 libxcb-xfixes0 \
              libxcb-xinerama0 libxcb-xkb1 \
              libxext6 libxrender1 libxi6 \
              fuse libfuse2 \
              file wget zsync \
              upx-ucl \
              qt6-base-dev qt6-svg-dev qt6-tools-dev qt6-tools-dev-tools

      # ── Verify the toolchain (defensive diagnostics) ───────────────
      # If any of these checks fail we want a clear error message
      # in the log instead of a cryptic "Qt6 not found" later.
      - name: Verify toolchain
        run: |
          echo "=== Compiler ==="
          g++-16 --version
          echo
          echo "=== CMake ==="
          cmake --version
          echo
          echo "=== Qt (jurplel) ==="
          if [ -n "${Qt6_DIR:-}" ]; then
            echo "Qt6_DIR = ${Qt6_DIR}"
            QT_ROOT="$(dirname "$(dirname "${Qt6_DIR}")")"
            echo "Qt root = ${QT_ROOT}"
            ls "${QT_ROOT}/lib/cmake/" 2>/dev/null | head -20 || true
          else
            echo "WARNING: Qt6_DIR is not set"
          fi
          echo
          echo "=== Qt 6 (apt backup) ==="
          dpkg -l | grep -E "^ii\s+(qt6-base-dev|qt6-svg-dev|libqt6)" | \
              awk '{print "  " $2 " " $3}' | head -10
          echo
          echo "=== upx ==="
          if command -v upx >/dev/null 2>&1; then
            upx --version
          else
            echo "ERROR: upx is not installed"
            exit 1
          fi
          echo
          echo "=== system libs available ==="
          dpkg -l | grep -E "libxkbcommon|libfontconfig|libgl1-mesa|libsqlite3" | \
              awk '{print "  " $2 " " $3}' | head -10

      # ── Configure ─────────────────────────────────────────────────
      # CMAKE_PREFIX_PATH is set explicitly to the jurplel Qt root
      # so find_package(Qt6 ...) cannot accidentally pick the apt
      # qt6-base-dev installation at /usr/lib/x86_64-linux-gnu/
      # (jurplel's headers are newer, which is what we want for
      # 6.8.*; if we omitted this, the configure step would still
      # succeed — apt's Qt 6.8 also satisfies the 6.5+ requirement
      # — but the resulting binary would link against the older
      # system libraries, not the ones we're about to bundle in
      # the AppDir).
      - name: Configure (Release + tests)
        run: >
          cmake -S . -B build
          -G Ninja
          -DCMAKE_CXX_COMPILER=g++-16
          -DCMAKE_BUILD_TYPE=Release
          -DBUILD_TESTING=ON
          -DIPVIEW_MINSIZE=ON
          -DIPVIEW_STRIP_BINARY=ON
          -DIPVIEW_COMPRESS_BINARY=ON
          -DIPVIEW_SIZE_REPORT=ON
          -DCMAKE_PREFIX_PATH="${Qt6_DIR}/../.."

      # ── Build ─────────────────────────────────────────────────────
      - name: Build
        run: cmake --build build -j"$(nproc)"

      # ── Unit tests ─────────────────────────────────────────────────
      - name: Run unit tests
        run: ctest --test-dir build --output-on-failure

      # ── Smoke test ─────────────────────────────────────────────────
      # Run the binary on the offscreen platform for 3 s. Exit
      # 124 is the timeout code — the app is designed to keep
      # running, so that is the expected outcome.
      - name: Smoke test
        run: |
          timeout 3 ./build/IPView -platform offscreen || [ $? -eq 124 ]

      # ── appimagetool ───────────────────────────────────────────────
      # The "12" tag on AppImage/AppImageKit is the current stable
      # release; tag "13" was an obsolete archive that no longer
      # carries a working appimagetool-x86_64.AppImage. The
      # --appimage-extract-and-run fallback is required on GitHub
      # runners because FUSE is not available there by default.
      - name: Download appimagetool
        run: |
          wget -q -c \
              "https://github.com/AppImage/AppImageKit/releases/download/12/appimagetool-x86_64.AppImage"
          chmod +x appimagetool-x86_64.AppImage
          ./appimagetool-x86_64.AppImage --appimage-extract-and-run --version

      # ── Verify built binary (defensive diagnostics) ────────────────
      # Print the ldd output of the freshly built binary so that
      # any "missing libfoo.so.N" is visible in the log before the
      # AppImage step tries to bundle. Also lists the Qt 6 libs
      # we are about to ship so the diff between "linked" and
      # "bundled" is auditable.
      - name: Verify built binary
        run: |
          echo "=== ldd build/IPView ==="
          ldd build/IPView
          echo
          echo "=== Missing libs (should be empty) ==="
          ldd build/IPView | grep "not found" || echo "  (none — all libs resolved)"
          echo
          echo "=== UPX status ==="
          if command -v upx >/dev/null 2>&1; then
            upx -t build/IPView && echo "  (compressed binary verifies OK)" || echo "  (binary is not UPX-compressed — that's fine, the AppImage step doesn't need it)"
          fi

      # ── Assemble AppDir ───────────────────────────────────────────
      # AppDir is the standard AppImage staging directory. The
      # binary lives at AppDir/usr/bin/IPView so the AppImage
      # launches the same way the build artefact does. We bundle
      # the Qt 6 runtime libraries (Core, DBus, Gui, Network,
      # Sql, Svg, Widgets) so the AppImage starts on bare systems
      # that don't have Qt 6.5+ installed.
      - name: Assemble AppDir
        run: |
          mkdir -p AppDir/usr/bin AppDir/usr/lib
          cp build/IPView AppDir/usr/bin/
          cp ipview.desktop AppDir/
          cp icon.svg AppDir/ipview-pro.svg

          # jurplel installs Qt 6 to /opt/hostedtoolcache/Qt/<ver>/<arch>
          # by default. Use Qt6_DIR (the cmake dir) to find the lib
          # dir robustly without hard-coding the host layout.
          if [ -n "$Qt6_DIR" ]; then
            QT_LIB_DIR="$(dirname "$(dirname "$Qt6_DIR")")/lib"
          else
            QT_LIB_DIR="$(find /opt/hostedtoolcache/Qt -maxdepth 4 -type d -name lib 2>/dev/null | head -1)"
          fi
          echo "Qt lib dir: $QT_LIB_DIR"

          for lib in \
              libQt6Core.so.6 \
              libQt6DBus.so.6 \
              libQt6Gui.so.6 \
              libQt6Network.so.6 \
              libQt6Sql.so.6 \
              libQt6Svg.so.6 \
              libQt6Widgets.so.6; do
            find "$QT_LIB_DIR" -name "${lib}*" -exec cp -P {} AppDir/usr/lib/ \; 2>/dev/null || true
          done

          echo "=== ldd check ==="
          ldd AppDir/usr/bin/IPView | grep "not found" || echo "All libraries resolved."

      # ── Build AppImage ────────────────────────────────────────────
      - name: Build AppImage
        run: |
          ./appimagetool-x86_64.AppImage --appimage-extract-and-run \
              AppDir \
              IPView-x86_64.AppImage
        env:
          ARCH: x86_64

      # ── SHA-256SUMS ───────────────────────────────────────────────
      - name: Generate SHA-256SUMS
        run: |
          sha256sum IPView-x86_64.AppImage > SHA-256SUMS
          cat SHA-256SUMS

      # ── GitHub Release (via gh CLI) ────────────────────────────────
      # We use the official `gh` CLI instead of softprops/action-gh-
      # release because (a) softprops is a Node.js action that is
      # not yet updated for Node 24, and (b) `gh` is built into
      # every GitHub-hosted runner and has no external action dep.
      # The notes are extracted from CHANGELOG.md for the matching
      # version block.
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"

          # Pre-release flag for RC / beta / alpha tags.
          PRERELEASE_FLAG=""
          if [[ "$GITHUB_REF_NAME" == *rc* ]] || \
             [[ "$GITHUB_REF_NAME" == *beta* ]] || \
             [[ "$GITHUB_REF_NAME" == *alpha* ]]; then
            PRERELEASE_FLAG="--prerelease"
          fi

          # Extract the matching CHANGELOG section.
          NOTES_FILE="$(mktemp)"
          awk -v ver="[${VERSION}]" '
            /^##[[:space:]]/ {
              if (found) exit
              if (index($0, "## " ver) > 0) { found = 1; next }
            }
            found { print }
          ' CHANGELOG.md > "$NOTES_FILE"

          echo "=== Release notes (${VERSION}) ==="
          cat "$NOTES_FILE"
          echo "==================================="

          # shellcheck disable=SC2086
          gh release create "$GITHUB_REF_NAME" \
              IPView-x86_64.AppImage \
              SHA-256SUMS \
              --title "IPView Pro ${GITHUB_REF_NAME}" \
              --notes-file "$NOTES_FILE" \
              $PRERELEASE_FLAG
