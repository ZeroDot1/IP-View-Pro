name: lint

# Lints every push + PR. Two jobs: cppcheck for static analysis,
# and a build+test job to make sure the project still compiles
# and passes its test suite on the C++26 + Qt 6 baseline.

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  cppcheck:
    name: cppcheck
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install cppcheck
        run: sudo apt-get update && sudo apt-get install -y cppcheck
      - name: Run
        run: |
          cppcheck --enable=warning,style,performance,portability \
            --suppress=missingIncludeSystem \
            --error-exitcode=1 \
            --quiet \
            -I . \
            .

  build-test:
    name: build + test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      # GCC 16 for C++26.
      - name: Install GCC 16
        run: |
          sudo apt-get update
          sudo apt-get install -y software-properties-common
          sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test
          sudo apt-get update
          sudo apt-get install -y g++-16 gcc-16
          g++-16 --version

      - name: Install Qt 6.8
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.*'
          host: linux
          target: desktop
          arch: gcc_64
          modules: 'qtimageformats'
          cache: true

      - name: Install Linux deps
        run: |
          sudo apt-get install -y cmake ninja-build libgl1-mesa-dev libxkbcommon-dev libxkbcommon-x11-0 libdbus-1-3 libsqlite3-dev

      - name: Configure
        run: >
          cmake -S . -B build
          -G Ninja
          -DCMAKE_CXX_COMPILER=g++-16
          -DCMAKE_BUILD_TYPE=Release
          -DBUILD_TESTING=ON

      - name: Build
        run: cmake --build build -j$(nproc)

      - name: Test
        run: ctest --test-dir build --output-on-failure
